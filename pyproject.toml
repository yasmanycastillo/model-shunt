[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-shunt"
version = "1.2.1"
description = "Model routing for AI coding agents - delegate bulk file reading and boilerplate generation to fast, economical worker models via MCP. Zero dependencies."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "yasmanycastillo" }]
keywords = ["mcp", "llm", "model-routing", "ai-agents", "code-generation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://yasmanycastillo.github.io/model-shunt/"
Repository = "https://github.com/yasmanycastillo/model-shunt"
Issues = "https://github.com/yasmanycastillo/model-shunt/issues"

[project.scripts]
model-shunt = "model_shunt.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_shunt"]
